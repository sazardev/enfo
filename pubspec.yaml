name: enfo
description: Enfo, a flat, calm clock & timer toolbox.
publish_to: 'none'

version: 1.4.0+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  adaptive_theme: 3.7.2
  shared_preferences: ^2.5.5
  local_notifier: ^0.1.6
  window_manager: ^0.5.2
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0
  timezone: ^0.11.1
  vibration: ^3.2.1
  flutter_soloud: ^5.1.4
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  path_provider: ^2.1.6
  in_app_review: ^2.0.12
  share_plus: ^13.3.1
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  in_app_purchase_platform_interface: ^1.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/music/
    - assets/music/envelopes/

  fonts:
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700